# Quick Dial backend: deploys the Supabase edge functions in supabase/functions to the
# quick-dial project (London). Runs by hand (Actions → Quick Dial backend → Run workflow)
# and on every push to main that changes a function.
#
# Needs one GitHub secret: SUPABASE_ACCESS_TOKEN (supabase.com → Account → Access tokens).
# Without it the run only warns, so pushes never fail because of it.
#
# The project signs members' sessions with its newer (ECC) key, which the gateway's legacy JWT
# check rejects, so the functions the app calls (delete-account, suggest-replies, verify-start)
# are deployed without it and check the member themselves with auth.getUser(). verify-webhook is
# called by Didit, which has no Supabase sign-in; it checks Didit's signature and re-reads every
# decision from Didit instead.
# quick-push is also called by the cron job with a new-style secret key (no JWT), so it skips the
# gateway check too. quick-push and moderate-content accept only the server's keys
# (supabase/functions/_shared/service.ts); moderate-content keeps the gateway check as well.
# The function secrets (ANTHROPIC_API_KEY, DIDIT_*) are set in Supabase, not here.

name: Quick Dial backend

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**', '.github/workflows/quick-backend.yml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: jbcdzsfgqqmwwrwublzo
    steps:
      - uses: actions/checkout@v4

      - name: Access token set?
        id: gate
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "::warning::SUPABASE_ACCESS_TOKEN is not set, so nothing was deployed."
          fi

      - uses: supabase/setup-cli@v1
        if: steps.gate.outputs.ready == 'yes'
        with:
          version: latest

      - name: Deploy the edge functions
        if: steps.gate.outputs.ready == 'yes'
        run: |
          supabase functions deploy moderate-content --project-ref "$PROJECT_REF"
          for f in delete-account quick-push suggest-replies verify-start verify-webhook; do
            supabase functions deploy "$f" --project-ref "$PROJECT_REF" --no-verify-jwt
          done

      - name: List what is live
        if: steps.gate.outputs.ready == 'yes'
        run: supabase functions list --project-ref "$PROJECT_REF"
